<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IronBeat – Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #F5F2EC; color: #1C1C1E; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 24px; margin: 20px 0 8px; }
    p { margin: 0 0 24px; color: #706b63; }
    button { background: #D4A373; color: #1C1C1E; border: 0; border-radius: 16px; padding: 14px 28px; font-size: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="IronBeat">
    <h1>You're offline</h1>
    <p>IronBeat needs a connection to stream music. Reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </main>
</body>
</html>
